name: macprobe
on:
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15, macos-14, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          echo "RUNNER=${{ matrix.os }}"
          sw_vers
          xcode-select -p
