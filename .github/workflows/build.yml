name: Build kcold dylib

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14          # Apple Silicon runner, 免费额度 2000 分钟/月
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos clang --version

      - name: Build kcold.dylib (arm64 + arm64e, min iOS 12.0)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"

          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -O2 \
            -miphoneos-version-min=12.0 \
            -isysroot "$SDK" -framework Foundation -framework Security \
            -install_name /tmp/kcold.dylib -o kcold_arm64.dylib kcold.m
          file kcold_arm64.dylib

          if xcrun --sdk iphoneos clang -arch arm64e -dynamiclib -O2 \
               -miphoneos-version-min=12.0 \
               -isysroot "$SDK" -framework Foundation -framework Security \
               -install_name /tmp/kcold.dylib -o kcold_arm64e.dylib kcold.m; then
            lipo -create kcold_arm64.dylib kcold_arm64e.dylib -output kcold.dylib
            echo "built: universal (arm64 + arm64e)"
          else
            cp kcold_arm64.dylib kcold.dylib
            echo "arm64e unsupported -> arm64 only"
          fi

          file kcold.dylib
          ls -la kcold.dylib

      - name: Ad-hoc sign (注入加载成功率高很多)
        run: |
          set -e
          codesign -fs - --force --timestamp=none kcold.dylib
          codesign -dv --verbose=2 kcold.dylib 2>&1 | head -12
          echo "---- entitlements (empty on purpose) ----"
          codesign -d --entitlements :- kcold.dylib 2>&1 | head -5 || true

      - name: Report
        run: |
          file kcold.dylib
          lipo -info kcold.dylib
          xcrun --sdk iphoneos otool -l kcold.dylib | grep -A4 LC_BUILD_VERSION | head -10 || true
          shasum -a 256 kcold.dylib
          du -h kcold.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kcold-dylib
          path: kcold.dylib
          if-no-files-found: error
